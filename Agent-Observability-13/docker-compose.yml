# Dockerized agent path: FastAPI + Postgres + Redis/Celery + observability agent.
# Build context is the july-cohort repo root (parent of this folder).
#
#   cd Session-Observability
#   docker compose up --build
#   python scripts/docker_opening_demo.py

name: session-observability

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_service
    ports: ["5432:5432"]
    volumes:
      - ../async-execution/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_service"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Session-Observability/docker/Dockerfile
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_service
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOW_DEMO_FAULTS: "true"
      API_BASE_URL: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: Session-Observability/docker/Dockerfile
    command: celery -A app.celery_app.app worker --loglevel=INFO --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_service
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOW_DEMO_FAULTS: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  outbox:
    build:
      context: ..
      dockerfile: Session-Observability/docker/Dockerfile
    command: python -m app.outbox_main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_service
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALLOW_DEMO_FAULTS: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      worker: {condition: service_started}

volumes:
  pgdata:
